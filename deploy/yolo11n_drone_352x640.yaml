# yolo11n_drone 352×640 变体（对齐官方示例输入规格 net_w:640 / net_h:352）
# 与 640×640 主版本的区别仅：输入尺寸、文件名、锚点数 4620（44×80 + 22×40 + 11×20）
# view_except_op_ids 与 640 版相同：op0=输入节点、op275=输出节点

sys:
  Version: __3.31__
  device: axi://zg330aiu?npu=0x40000000&dma=0x80000000
  mmuMode: true
  speedMode: false
  compressFtmp: false
  ocm_option: -1
  profile: false
  run_backend: zg330
  dump_output: false
  dump_format: SFB
  log_path: ../io/output/ftmp
  SKIP_CAMERA_ERROR: false
  DEBUG: true
  DEBUG_FLAGS: 1

pipeline:
  camera:
    vtc: false
    width: 1920
    height: 1080
    fps: 60
  display:
    type: hdmi
    width: 1920
    height: 1080
    fps: 60
  icore:
    model: yolo11n_drone_352
    jsons:
    - ./yolo11n_drone_352_ZG.json
    raws:
    - ./yolo11n_drone_352_ZG.raw
    net_w: 640
    net_h: 352
    view_except_op_ids: [0, 275]
    names: names/drone.names
    conf: 0.25
    iou_thresh: 0.45
    multilabel: false
    number_of_class: 1
    anchors: []          # anchor-free；352 版网格 44×80 / 22×40 / 11×20，N=4620
    fpga_nms: false
    detpost: false       # 截断头：DFL/sigmoid/NMS 全部 CPU 侧，见 cpu_decode_demo.py
