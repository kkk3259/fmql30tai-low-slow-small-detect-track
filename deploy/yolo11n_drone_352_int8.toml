# YOLO11n 截断版 INT8 转换配置（模仿 icraft_modelzoo yolov5s_int8.toml 的 ZG 模板）
# 用法（Icraft 安装后）：icraft compile D:/icraft_work/yolo11n_drone_352_int8.toml
# 注意：字段取值以本机 icraft docs 为准，安装后如有出入需微调（framework/inputs_layout/no_transinput）。

[parse]
net_name = "yolo11n_drone_352"
framework = "onnx"
inputs = [ 1, 352, 640, 3]
inputs_layout = "NHWC"
inputs_dtype = "UINT8"
pre_method = "nop"
pre_scale = [ 255.0, 255.0, 255.0]
pre_mean = [ 0.0, 0.0, 0.0]
channel_swap = [ 0, 1, 2]
image_channel_order = "rgb"
network = "./yolo11n_drone_trunc_352x640.onnx"
jr_path = "./out/"
target = "zhuge"

[optimize]
target = "zhuge"
json = "./out/yolo11n_drone_352_parsed.json"
raw = "./out/yolo11n_drone_352_parsed.raw"
jr_path = "./out/"

[quantize]
forward_mode = "image"
saturation = "kld"
forward_dir = "./calib"
forward_list = "./calib/dut.txt"
qdtype = "int8"
json = "./out/yolo11n_drone_352_optimized.json"
raw = "./out/yolo11n_drone_352_optimized.raw"
jr_path = "./out/"
per = "channel"
target = "zhuge"
no_transinput = true

[adapt]
target = "zhuge"
json = "./out/yolo11n_drone_352_quantized.json"
raw = "./out/yolo11n_drone_352_quantized.raw"
jr_path = "./out/"

[generate]
json = "./out/yolo11n_drone_352_adapted.json"
raw = "./out/yolo11n_drone_352_adapted.raw"
jr_path = "./out/"
log_path = "./out/logs/"

[run]
log_time = true
log_io = true
dump_format = "SFB"
json = "./out/yolo11n_drone_352_ZG.json"
raw = "./out/yolo11n_drone_352_ZG.raw"
input = "./calib/dut/00001.jpg"
log_path = "./out/logs/"
